<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9f0f8">
<title>跳一跳 · 小鲸鱼</title>
<style>
  /* ============================================================
     页面与游戏容器
     ============================================================ */
  :root {
    --ink: #2b3650;
    --muted: #8e9bb2;
    --line: rgba(52, 78, 122, 0.08);
    --accent: #3b82f6;
    --accent-deep: #2563eb;
    --sky: #7dd3fc;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 22px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 17% 12%, rgba(255, 255, 255, 0.97), transparent 36%),
      radial-gradient(circle at 84% 8%, rgba(176, 213, 255, 0.58), transparent 36%),
      radial-gradient(circle at 50% 106%, rgba(196, 231, 255, 0.62), transparent 50%),
      #e9f0f8;
    user-select: none;
    -webkit-user-select: none;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 13px;
  }

  .game-shell {
    position: relative;
    isolation: isolate;
    width: min(92vw, 500px);
    height: clamp(470px, calc(100vh - 92px), 760px);
    height: clamp(470px, calc(100svh - 92px), 760px);
    overflow: hidden;
    border-radius: 30px;
    cursor: pointer;
    background:
      radial-gradient(circle at 22% 14%, rgba(255, 255, 255, 0.99), transparent 42%),
      radial-gradient(circle at 84% 6%, rgba(183, 216, 255, 0.52), transparent 33%),
      radial-gradient(circle at 48% 97%, rgba(206, 235, 255, 0.58), transparent 46%),
      linear-gradient(155deg, #fbfdff 0%, #eef5fd 58%, #e7f0fa 100%);
    box-shadow:
      0 42px 90px -30px rgba(40, 66, 110, 0.4),
      0 12px 28px -18px rgba(40, 66, 110, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.96);
  }

  /* 背景细点阵 */
  .game-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.46;
    background-image: radial-gradient(rgba(78, 112, 160, 0.13) 0.75px, transparent 0.9px);
    background-size: 23px 23px;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.4) 54%, transparent 88%);
    mask-image: linear-gradient(to bottom, #000 0%, rgba(0, 0, 0, 0.4) 54%, transparent 88%);
  }

  /* 右上角柔光 */
  .game-shell::after {
    content: "";
    position: absolute;
    top: -90px;
    right: -74px;
    z-index: 0;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0));
    filter: blur(2px);
  }

  canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }

  /* ============================================================
     顶部 HUD
     ============================================================ */
  .hud {
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    z-index: 4;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 24px 26px 0;
    pointer-events: none;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 38px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #46536e;
  }

  .brand-mark {
    position: relative;
    display: grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border-radius: 10px;
    background: linear-gradient(160deg, #ffffff 0%, #eaf3ff 100%);
    box-shadow:
      0 8px 18px -10px rgba(37, 99, 235, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    transform: rotate(-5deg);
  }

  .brand-mark img {
    display: block;
    width: 22px;
    height: auto;
    filter: drop-shadow(0 1px 1px rgba(37, 99, 235, 0.18));
  }

  .score-card {
    display: flex;
    min-width: 108px;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    padding: 8px 14px 7px 15px;
    border: 1px solid rgba(255, 255, 255, 0.94);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.7);
    box-shadow:
      0 12px 30px -20px rgba(40, 66, 110, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
  }

  .score-top {
    display: flex;
    width: 100%;
    align-items: baseline;
    justify-content: flex-end;
    gap: 9px;
  }

  .score-card span {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #9ca8bc;
  }

  .score-card strong {
    min-width: 1.1em;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.04em;
    text-align: right;
    color: #2b3750;
  }

  .score-best {
    margin-top: 2px;
    color: #a8b3c6;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .score-best b {
    margin-left: 2px;
    color: #427ee5;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .score-card.pop {
    animation: scorePop 0.36s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes scorePop {
    0% { transform: scale(1); }
    38% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* 精准连击提示 */
  .combo-badge {
    position: absolute;
    top: 84px;
    left: 50%;
    z-index: 5;
    padding: 7px 13px;
    border: 1px solid rgba(59, 130, 246, 0.18);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: 0 10px 24px -16px rgba(37, 99, 235, 0.62);
    color: #2f6fe4;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -7px) scale(0.92);
    transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .combo-badge.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  .combo-badge b {
    font-size: 13px;
    letter-spacing: 0;
  }

  /* ============================================================
     蓄力条
     ============================================================ */
  .charge-panel {
    position: absolute;
    bottom: 64px;
    left: 50%;
    z-index: 4;
    width: min(64%, 268px);
    pointer-events: none;
    opacity: 0.52;
    transform: translateX(-50%);
    transition: opacity 0.22s ease;
  }

  .charge-panel.active {
    opacity: 1;
  }

  .charge-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
    color: #98a4b8;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.2em;
  }

  .charge-meta span:last-child {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
  }

  .charge-track {
    position: relative;
    height: 8px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.86);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.58);
    box-shadow:
      inset 0 1px 3px rgba(43, 66, 100, 0.09),
      0 6px 14px -12px rgba(43, 66, 100, 0.5);
  }

  .charge-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #a5e3ff 0%, #62b7ff 46%, #3b82f6 100%);
    box-shadow: 0 0 14px rgba(59, 130, 246, 0.42);
    transform: scaleX(0);
    transform-origin: left center;
  }

  .charge-track.is-max .charge-fill {
    animation: chargePulse 0.6s ease-in-out infinite alternate;
  }

  @keyframes chargePulse {
    from { filter: brightness(1); }
    to { filter: brightness(1.14); }
  }

  /* 底部操作提示 */
  .hint {
    position: absolute;
    right: 0;
    bottom: 24px;
    left: 0;
    z-index: 4;
    margin: 0;
    color: #a2adc0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-align: center;
    pointer-events: none;
    transition: color 0.2s ease;
  }

  .hint.active {
    color: #2f6fe4;
  }

  /* ============================================================
     结束弹窗
     ============================================================ */
  .game-over {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(236, 244, 253, 0.6);
    -webkit-backdrop-filter: blur(8px) saturate(0.92);
    backdrop-filter: blur(8px) saturate(0.92);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .game-over.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .over-card {
    position: relative;
    width: min(100%, 328px);
    padding: 31px 27px 23px;
    border: 1px solid rgba(255, 255, 255, 0.96);
    border-radius: 26px;
    background: #ffffff;
    box-shadow:
      0 34px 74px -28px rgba(34, 56, 94, 0.46),
      inset 0 1px 0 rgba(255, 255, 255, 0.96);
    text-align: center;
    transform: translateY(18px) scale(0.955);
    transition: transform 0.4s cubic-bezier(0.2, 0.85, 0.25, 1);
  }

  .game-over.show .over-card {
    transform: translateY(0) scale(1);
  }

  .over-avatar {
    display: block;
    width: 68px;
    height: 68px;
    margin: -54px auto 12px;
    border: 4px solid rgba(255, 255, 255, 0.96);
    border-radius: 50%;
    background: linear-gradient(150deg, #eaf4ff, #d8eaff);
    object-fit: cover;
    box-shadow:
      0 14px 26px -14px rgba(37, 99, 235, 0.6),
      0 0 0 1px rgba(59, 130, 246, 0.1);
  }

  .over-eyebrow {
    margin: 0 0 7px;
    color: #b0bbcb;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3em;
  }

  .over-card h2 {
    margin: 0 0 7px;
    color: #2c3852;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .over-sub {
    min-height: 18px;
    margin: 0 0 20px;
    color: #9aa6ba;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .final-score {
    margin-bottom: 11px;
    padding: 15px 16px 13px;
    border: 1px solid rgba(52, 78, 122, 0.045);
    border-radius: 18px;
    background: linear-gradient(140deg, #f8fbff 0%, #edf3fa 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
  }

  .final-score span {
    display: block;
    margin-bottom: 3px;
    color: #a3aec1;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }

  .final-score strong {
    color: #2f3b54;
    font-size: 48px;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.05em;
  }

  .best-row {
    margin-bottom: 19px;
    color: #9da9bc;
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  .best-row b {
    margin-left: 2px;
    color: #3b82f6;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .restart-btn {
    width: 100%;
    padding: 14px 20px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(135deg, #63a9ff 0%, #3b82f6 52%, #2563eb 100%);
    box-shadow:
      0 16px 28px -14px rgba(37, 99, 235, 0.72),
      inset 0 1px 0 rgba(255, 255, 255, 0.36);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.09em;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }

  .restart-btn span {
    display: inline-block;
    margin-left: 5px;
    font-size: 16px;
    font-weight: 400;
  }

  .restart-btn:hover {
    transform: translateY(-1px);
    box-shadow:
      0 19px 32px -14px rgba(37, 99, 235, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.36);
  }

  .restart-btn:active {
    transform: translateY(1px) scale(0.994);
  }

  .restart-btn:focus-visible {
    outline: 3px solid rgba(59, 130, 246, 0.35);
    outline-offset: 3px;
  }

  .over-tip {
    margin: 15px 0 0;
    color: #b2bdcf;
    font-size: 9px;
    line-height: 1.6;
    letter-spacing: 0.04em;
  }

  .page-tip {
    margin: 0;
    color: #9faec0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-align: center;
  }

  .game-shell.is-over {
    cursor: default;
  }

  .game-shell.is-over .restart-btn {
    cursor: pointer;
  }

  /* 小屏幕适配 */
  @media (max-width: 390px) {
    .hud {
      padding: 20px 18px 0;
    }

    .brand {
      font-size: 14px;
    }

    .score-card {
      padding: 8px 12px 7px 13px;
    }

    .score-card strong {
      font-size: 24px;
    }

    .combo-badge {
      top: 75px;
    }

    .charge-panel {
      bottom: 60px;
      width: 68%;
    }

    .over-card {
      padding: 28px 22px 21px;
    }

    .over-avatar {
      width: 62px;
      height: 62px;
      margin-top: -50px;
    }

    .final-score strong {
      font-size: 43px;
    }
  }

  @media (max-height: 640px) {
    body {
      padding: 12px;
    }

    .page-tip {
      display: none;
    }

    .game-shell {
      height: calc(100vh - 24px);
      height: calc(100svh - 24px);
    }

    .game-over {
      padding: 18px;
    }

    .over-card {
      padding: 25px 22px 19px;
    }

    .over-avatar {
      width: 58px;
      height: 58px;
      margin: -48px auto 10px;
    }

    .over-card h2 {
      font-size: 23px;
    }

    .over-sub {
      margin-bottom: 14px;
    }

    .final-score {
      padding: 11px 14px 10px;
      margin-bottom: 9px;
    }

    .final-score strong {
      font-size: 40px;
    }

    .best-row {
      margin-bottom: 14px;
    }

    .restart-btn {
      padding: 12px 18px;
    }

    .over-tip {
      margin-top: 10px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .score-card.pop,
    .charge-track.is-max .charge-fill {
      animation: none;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <main class="game-shell" id="gameShell">
      <canvas id="gameCanvas" tabindex="0" aria-label="跳一跳游戏画面，按住蓄力，松开起跳"></canvas>

      <header class="hud">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><img id="brandIcon" alt=""></span>
          <span>跳一跳</span>
        </div>
        <div class="score-card" id="scoreCard">
          <div class="score-top">
            <span>分数</span>
            <strong id="scoreValue" aria-live="polite">0</strong>
          </div>
          <div class="score-best">最佳 <b id="bestValue">0</b></div>
        </div>
      </header>

      <div class="combo-badge" id="comboBadge" aria-live="polite">精准连击 <b>×1</b></div>

      <div class="charge-panel" id="chargePanel">
        <div class="charge-meta">
          <span>蓄力</span>
          <span id="chargeValue">0%</span>
        </div>
        <div class="charge-track" id="chargeTrack" role="progressbar"
             aria-label="蓄力进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="charge-fill" id="chargeFill"></div>
        </div>
      </div>

      <p class="hint" id="hint">按住蓄力 · 松开起跳</p>

      <div class="game-over" id="gameOver" role="dialog" aria-modal="true"
           aria-labelledby="gameOverTitle" aria-hidden="true">
        <div class="over-card">
          <img class="over-avatar" id="overAvatar" alt="" aria-hidden="true">
          <p class="over-eyebrow">GAME OVER</p>
          <h2 id="gameOverTitle">掉下去了</h2>
          <p class="over-sub" id="overSub">差一点点，再来一次吧</p>
          <div class="final-score">
            <span>本局得分</span>
            <strong id="finalScore">0</strong>
          </div>
          <div class="best-row">最佳成绩 <b id="bestScore">0</b></div>
          <button class="restart-btn" id="restartBtn" type="button">再来一局 <span>↻</span></button>
          <p class="over-tip">落在方块中心，连续精准可以额外加分</p>
        </div>
      </div>
    </main>

    <p class="page-tip">按住蓄力，松开起跳 · 越靠中心，得分越高</p>
  </div>

<script>
(() => {
  "use strict";

  /* ============================================================
     一、DOM 与图片资源
     ============================================================ */
  const gameShell = document.getElementById("gameShell");
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const scoreCard = document.getElementById("scoreCard");
  const scoreValue = document.getElementById("scoreValue");
  const bestValue = document.getElementById("bestValue");
  const comboBadge = document.getElementById("comboBadge");
  const chargePanel = document.getElementById("chargePanel");
  const chargeTrack = document.getElementById("chargeTrack");
  const chargeFill = document.getElementById("chargeFill");
  const chargeValue = document.getElementById("chargeValue");
  const hint = document.getElementById("hint");

  const gameOverEl = document.getElementById("gameOver");
  const gameOverTitle = document.getElementById("gameOverTitle");
  const overSub = document.getElementById("overSub");
  const finalScore = document.getElementById("finalScore");
  const bestScore = document.getElementById("bestScore");
  const restartBtn = document.getElementById("restartBtn");

  const brandIcon = document.getElementById("brandIcon");

  /* ============================================================
     二、常量与工具
     ============================================================ */
  const TAU = Math.PI * 2;
  const COS30 = Math.cos(Math.PI / 6);
  const SIN30 = 0.5;
  const BASE_SCALE = 60;

  // 角色尺寸（世界单位）与立绘宽高比
  const CHAR_H = 1.82;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 浅色方块配色：top 顶面、left 左侧面、right 右侧面
  const PALETTES = [
    { top: "#e4eefc", left: "#c7dcf3", right: "#aecbe8" }, // 雾蓝
    { top: "#fdf0e4", left: "#ecd3bd", right: "#ddbea3" }, // 奶油桃

    { top: "#fde9ee", left: "#eecdd6", right: "#deb0be" }  // 樱粉
  ];

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (min, max) => min + Math.random() * (max - min);
  const randInt = (max) => Math.floor(Math.random() * max);
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = (t) =>
    t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // 将十六进制颜色调亮 / 调暗，amount 为 -1 ~ 1
  function shade(hex, amount) {
    const raw = hex.replace("#", "");
    const num = parseInt(raw, 16);
    let r = (num >> 16) & 255;
    let g = (num >> 8) & 255;
    let b = num & 255;
    if (amount >= 0) {
      r = Math.round(r + (255 - r) * amount);
      g = Math.round(g + (255 - g) * amount);
      b = Math.round(b + (255 - b) * amount);
    } else {
      const k = 1 + amount;
      r = Math.round(r * k);
      g = Math.round(g * k);
      b = Math.round(b * k);
    }
    return `rgb(${r}, ${g}, ${b})`;
  }

  /* ============================================================
     三、画布尺寸与等距投影
     ============================================================ */
  let cssWidth = 0;
  let cssHeight = 0;
  let dpr = 1;
  let viewScale = BASE_SCALE;
  let originX = 0;
  let originY = 0;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    cssWidth = rect.width;
    cssHeight = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 根据画布大小自动缩放，手机和桌面都能保持合适的构图
    const fit = Math.min(cssWidth / 500, cssHeight / 760);
    viewScale = BASE_SCALE * clamp(fit, 0.6, 1.08);
    originX = cssWidth * 0.5;
    originY = cssHeight * 0.545;
  }

  // 相机：用世界投影坐标表示画面中心
  const camera = { x: 0, y: 0 };
  let shakeX = 0;
  let shakeY = 0;
  let shakeAmp = 0;
  let shakePhase = 0;

  // 世界坐标 -> 等距投影坐标（未乘比例、未加相机偏移）
  function rawProject(x, y, z) {
    return {
      x: (x - z) * COS30,
      y: -(x + z) * SIN30 - y
    };
  }

  // 带相机和屏幕原点的最终投影
  function project(x, y, z) {
    const raw = rawProject(x, y, z);
    return {
      x: originX + (raw.x - camera.x) * viewScale + shakeX,
      y: originY + (raw.y - camera.y) * viewScale + shakeY
    };
  }

  /* ============================================================
     五、存档
     ============================================================ */
  function loadBest() {
    try {
      const value = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
      return Number.isFinite(value) && value > 0 ? value : 0;
    } catch (error) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(STORAGE_KEY, String(value));
    } catch (error) {
      // 本地文件或隐私模式下可能无法使用 localStorage，忽略即可
    }
  }

  /* ============================================================
     六、方块生成
     ============================================================ */
  function makeStarterBlock() {
    return {
      x: 0,
      z: 0,
      w: 1.65,
      d: 1.6,
      h: 0.85,
      side: 2.0,
      paletteIndex: 0,
      palette: PALETTES[0],
      grow: 1,
      born: -1e9
    };
  }

  // 根据当前方块生成下一块：大小、距离、高度都会变化
  function makeNextBlock(from, easy = false) {
    const level = clamp(score / 26, 0, 1);
    const distance = easy
      ? rand(2.55, 3.25)
      : rand(2.35 + level * 0.4, 4.25 + level * 0.5);
    const w = rand(1.45 - level * 0.25, 1.8 - level * 0.25);
    const d = rand(1.4, 1.85);
    const h = clamp(from.h + rand(-0.62, 0.62), 0.55, 1.75);
    const side = rand(1.7, 2.15);

    // 避免连续两个方块颜色相同
    let paletteIndex = randInt(PALETTES.length);
    while (paletteIndex === from.paletteIndex) {
      paletteIndex = randInt(PALETTES.length);
    }

    return {
      x: from.x + distance,
      z: 0,
      w,
      d,
      h,
      side,
      paletteIndex,
      palette: PALETTES[paletteIndex],
      grow: 0,
      born: performance.now()
    };
  }

  /* ============================================================
     七、相机跟随 / 屏幕震动
     ============================================================ */
  function getCameraTarget() {
    if (!currentBlock || !nextBlock) return { x: camera.x, y: camera.y };

    const a = rawProject(currentBlock.x, currentBlock.h, currentBlock.z);
    const b = rawProject(nextBlock.x, nextBlock.h, nextBlock.z);
    let mx = (a.x + b.x) * 0.5;
    let my = (a.y + b.y) * 0.5;

    // 起跳时镜头轻微跟向角色，让腾空更有临场感
    if (phase === "jumping" && jump) {
      const p = rawProject(player.x, player.y, player.z);
      mx = lerp(mx, p.x, 0.26);
      my = lerp(my, p.y, 0.18);
    }
    return { x: mx, y: my };
  }

  function snapCamera() {
    const target = getCameraTarget();
    camera.x = target.x;
    camera.y = target.y;
    shakeX = 0;
    shakeY = 0;
    shakeAmp = 0;
  }

  function addShake(amount) {
    if (reduceMotion) return;
    shakeAmp = Math.min(12, Math.max(shakeAmp, amount));
  }

  function updateCamera(dt) {
    const target = getCameraTarget();
    const ease = 1 - Math.exp(-dt * 5.1);
    camera.x += (target.x - camera.x) * ease;
    camera.y += (target.y - camera.y) * ease;

    if (shakeAmp > 0.02) {
      shakePhase += dt * 46;
      shakeX = Math.sin(shakePhase * 1.7) * shakeAmp;
      shakeY = Math.cos(shakePhase * 2.3) * shakeAmp * 0.62;
      shakeAmp *= Math.exp(-dt * 7.8);
    } else {
      shakeAmp = 0;
      shakeX = 0;
      shakeY = 0;
    }
  }

      comboBadge.classList.remove("show");

  }

  function hideComboBadge() {
    window.clearTimeout(comboTimer);
    comboBadge.classList.remove("show");
  }

  function updateChargeUI(value) {
    const safe = clamp(value, 0, 1);
    const percent = Math.round(safe * 100);

    chargeFill.style.transform = `scaleX(${safe})`;
    chargeTrack.setAttribute("aria-valuenow", String(percent));
    chargeTrack.classList.toggle("is-max", safe >= 0.995);

    if (percent !== lastChargePercent) {
      lastChargePercent = percent;
      chargeValue.textContent = `${percent}%`;
    }
  }

     九、初始化 / 重开
     ============================================================ */
  function resetGame() {
    window.clearTimeout(comboTimer);
    window.clearTimeout(chargeResetTimer);
    window.clearTimeout(scorePopTimer);
    window.clearTimeout(gameOverTimer);

    phase = "ready";
    isHolding = false;
    score = 0;
    combo = 0;
    charge = 0;
    chargeStart = 0;
    jump = null;
    fall = null;
    squash = 0;
    squashVel = 0;
    effects = [];
    trail = [];
    lastMiss = "short";
    lastChargePercent = -1;
    lastTrailAt = 0;
    chargeSparkAt = 0;
    landingGlowUntil = 0;
    shakeAmp = 0;
    shakeX = 0;
    shakeY = 0;

    currentBlock = makeStarterBlock();
    nextBlock = makeNextBlock(currentBlock, true);
    prevBlock = null;

    player.x = currentBlock.x;
    player.y = currentBlock.h;
    player.z = currentBlock.z;

    updateScoreUI();
    updateBestUI();
    updateChargeUI(0);

    gameOverEl.classList.remove("show");
    gameOverEl.setAttribute("aria-hidden", "true");
    gameShell.classList.remove("is-over");

    if (document.activeElement && document.activeElement.tagName === "BUTTON") {
      document.activeElement.blur();

    canvas.focus({ preventScroll: true });

  /* ============================================================

  function beginCharge() {
    if (phase !== "ready") return;

    window.clearTimeout(chargeResetTimer);
    phase = "charging";
    isHolding = true;
    chargeStart = performance.now();
    charge = 0;
    lastChargePercent = -1;
    updateChargeUI(0);

    chargePanel.classList.add("active");
    hint.textContent = "松开起跳";
    hint.classList.add("active");
  }

  function cancelCharge() {
    if (phase !== "charging") return;

    phase = "ready";
    isHolding = false;
    charge = 0;
    updateChargeUI(0);
    chargePanel.classList.remove("active");
    hint.textContent = "按住蓄力 · 松开起跳";
    hint.classList.remove("active");
  }

  function releaseCharge() {
    if (phase !== "charging") {
      isHolding = false;
      return;
    }

    const now = performance.now();
    const value = clamp((now - chargeStart) / CHARGE_TIME, 0, 1);
    charge = value;
    updateChargeUI(value);
    isHolding = false;

    launchJump(value);
  }

  // 以指定蓄力值起跳（正常输入与调试共用）
  function launchJump(value) {
    if (!nextBlock) return;
    if (phase !== "charging" && phase !== "ready") return;

    const now = performance.now();
    const target = nextBlock;
    const c = clamp(value, 0, 1);

    const startX = player.x;
    const startY = player.y;
    const startZ = player.z;

    const distance = MIN_JUMP + c * (MAX_JUMP - MIN_JUMP);
    const endX = startX + distance;

    // 目标方块判定
    const judgeHalf = target.w / 2 - 0.02;
    const offset = Math.abs(endX - target.x);
    const success = offset <= judgeHalf;
    const perfectRange = Math.min(PERFECT_MAX_RANGE, target.w * 0.2);
    const perfect = success && offset <= perfectRange;

    if (endX < target.x - judgeHalf) lastMiss = "short";
    else if (endX > target.x + judgeHalf) lastMiss = "long";
    else lastMiss = "edge";

    // 失败时让角色继续向方块外/下方坠落
    let endY;
    if (success) {
      endY = target.h;
    } else if (lastMiss === "short") {
      endY = Math.min(startY, target.h) - 0.42;
    } else {
      endY = target.h - 0.18;
    }

    // 抛物线：先定飞行时长和最高点，再解出重力与初速度
    const duration = clamp(0.44 + distance * 0.062, 0.5, 0.82); // 秒
    const apex = 0.9 + distance * 0.15;
    let gravity = (8 * apex) / (duration * duration);
    let vy0 = (endY - startY + 0.5 * gravity * duration * duration) / duration;
    if (vy0 < 1.1) {
      vy0 = 1.1;
      gravity = (2 * (startY + vy0 * duration - endY)) / (duration * duration);
    }

    jump = {
      start: now,
      duration,
      startX,
      startY,
      startZ,
      endX,
      endY,
      vy0,
      gravity,
      distance,
      success,
      perfect,
      perfectRange,
      target,
      vyEnd: vy0 - gravity * duration,
      t: 0
    };

    phase = "jumping";
    isHolding = false;
    charge = c;
    squash = -0.12;
    squashVel = 0;
    trail = [];
    lastTrailAt = now;

    spawnTakeoffEffects(now, startX, startY, startZ);

    chargePanel.classList.remove("active");
    hint.textContent = "按住蓄力 · 松开起跳";
    hint.classList.remove("active");

    // 蓄力条在 260ms 后回零，保留一次“释放”的视觉余韵
    window.clearTimeout(chargeResetTimer);
    chargeResetTimer = window.setTimeout(() => {
      if (phase !== "charging") {
        updateChargeUI(0);
        lastChargePercent = -1;
      }
    }, 260);
  }

  function finishJump(now) {
    if (!jump) return;
    const currentJump = jump;
    jump = null;

    player.x = currentJump.endX;
    player.z = currentJump.target.z;

    if (currentJump.success) {
      const target = currentJump.target;
      player.y = target.h;

      const offset = Math.abs(currentJump.endX - target.x);
      const isPerfect = offset <= currentJump.perfectRange;

      let gained = 1;
      if (isPerfect) {
        combo += 1;
        gained += Math.min(combo, MAX_COMBO_BONUS);
      } else {
        combo = 0;
        hideComboBadge();
      }

      // 落地弹性：速度越大压得越明显
      squash = 0.22 + clamp(Math.abs(currentJump.vyEnd) * 0.016, 0, 0.14);
      squashVel = 0;

      score += gained;
      updateScoreUI();
      popScoreCard();
      if (isPerfect) showComboBadge();

      spawnLandingEffects(target, gained, isPerfect, now);
      addShake(2.6 + Math.abs(currentJump.vyEnd) * 0.2);
      landingGlowUntil = isPerfect ? now + 420 : 0;
      trail = [];

      // 场景向前推进
      prevBlock = currentBlock;
      currentBlock = target;
      nextBlock = makeNextBlock(currentBlock);

      lastMiss = "edge";
      phase = "ready";
      hint.textContent = "按住蓄力 · 松开起跳";
    } else {
      player.y = currentJump.endY;
      phase = "falling";

      fall = {
        start: now,
        elapsed: 0,
        vy: Math.max(1.4, currentJump.vyEnd),
        vx: lastMiss === "long" ? 0.55 : -0.35,
        angle: TAU + 0.12,
        spin: 6.2 + rand(0, 2),
        endQueued: false
      };

      combo = 0;
      hideComboBadge();
      addShake(5.5);
      landingGlowUntil = 0;
      spawnMissBubble(now);
      spawnFallDust(now);
    }
  }

  /* ============================================================
     十一、特效
     ============================================================ */
  function pushEffect(effect) {
    effects.push(effect);
    if (effects.length > 90) effects.splice(0, effects.length - 90);
  }

  function spawnTakeoffEffects(now, x, y, z) {
    pushEffect({
      type: "takeoff-ring",
      x, y: y + 0.01, z,
      start: now,
      dur: 330
    });

    for (let i = 0; i < 6; i += 1) {
      const angle = rand(0, TAU);
      pushEffect({
        type: "dust",
        x, y: y + 0.02, z,
        ox: rand(-12, 12),
        oy: rand(-3, 3),
        vx: Math.cos(angle) * rand(18, 62),
        vy: Math.sin(angle) * rand(8, 26) - rand(10, 26),
        grav: 90,
        start: now + rand(0, 30),
        dur: rand(300, 520),
        size: rand(1.4, 3.2),
        color: "rgba(255, 255, 255, 0.8)"
      });
    }
  }

  function spawnLandingEffects(target, gained, isPerfect, now) {
    // 落地光圈
    pushEffect({
      type: "ring",
      x: player.x,
      z: target.z,
      y: target.h + 0.008,
      start: now,
      dur: isPerfect ? 680 : 520,
      perfect: isPerfect
    });

    // 贴地闪光
    pushEffect({
      type: "flash",
      x: player.x,
      z: target.z,
      y: target.h + 0.006,
      start: now,
      dur: 280,
      perfect: isPerfect
    });

    // 得分飘字（角色头顶）
    pushEffect({
      type: "text",
      x: player.x,
      z: target.z,
      y: target.h + CHAR_H + 0.34,
      start: now,
      dur: 1050,
      text: `+${gained}`,
      sub: isPerfect ? (combo > 1 ? `精准 ×${combo}` : "精准") : "",
      perfect: isPerfect
    });

    // 扬尘
    const count = isPerfect ? 16 : 10;
    for (let i = 0; i < count; i += 1) {
      const angle = rand(0, TAU);
      pushEffect({
        type: "dust",
        x: player.x,
        y: target.h + 0.02,
        z: target.z,
        ox: rand(-16, 16),
        oy: rand(-4, 3),
        vx: Math.cos(angle) * rand(22, 92),
        vy: Math.sin(angle) * rand(6, 34) - rand(14, 48),
        grav: 130,
        start: now + rand(0, 45),
        dur: rand(380, 660),
        size: rand(1.6, 4),
        color: i % 3 === 0
          ? "rgba(147, 197, 253, 0.85)"
          : "rgba(255, 255, 255, 0.85)"
      });
    }

    if (isPerfect) {
      // 星芒
      for (let i = 0; i < 12; i += 1) {
        const angle = rand(-Math.PI, 0);
        const speed = rand(50, 150);
        pushEffect({
          type: "spark",
          x: player.x,
          y: target.h + 0.04,
          z: target.z,
          ox: rand(-10, 10),
          oy: -rand(4, 18),
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          grav: 70,
          start: now + rand(0, 80),
          dur: rand(420, 760),
          size: rand(3, 6.5),
          rot: rand(0, TAU),
          spin: rand(-6, 6),
          color: i % 2 === 0 ? "#7dd3fc" : "#bfdbfe"
        });
      }

      // 小鲸鱼彩带
      for (let i = 0; i < 3; i += 1) {
        pushEffect({
          type: "whale",
          x: player.x,
          y: target.h + 0.06,
          z: target.z,
          ox: rand(-26, 26),
          oy: -rand(6, 26),
          vx: rand(-28, 28),
          vy: rand(-92, -48),
          grav: 55,
          start: now + rand(0, 110),
          dur: rand(620, 900),
          size: rand(13, 19),
          rot: rand(-0.4, 0.4),
          spin: rand(-1.6, 1.6)
        });
      }
    }
  }

  function spawnMissBubble(now) {
    pushEffect({
      type: "bubble",
      start: now,
      dur: 900,
      text: "!"
    });
  }

  function spawnFallDust(now) {
    for (let i = 0; i < 4; i += 1) {
      pushEffect({
        type: "dust",
        x: player.x,
        y: player.y + 0.02,
        z: player.z,
        ox: rand(-10, 10),
        oy: rand(-6, 6),
        vx: rand(-26, 26),
        vy: rand(-20, 4),
        grav: 100,
        start: now + rand(0, 40),
        dur: rand(260, 420),
        size: rand(1.4, 2.8),
        color: "rgba(147, 197, 253, 0.6)"
      });
    }
  }

  function spawnChargeSpark(now) {
    pushEffect({
      type: "dust",
      x: player.x,
      y: player.y + 0.02,
      z: player.z,
      ox: rand(-24, 24),
      oy: rand(-6, 4),
      vx: rand(-12, 12),
      vy: rand(-52, -22),
      grav: -12,
      start: now,
      dur: rand(320, 540),
      size: rand(0.9, 2.2),
      color: "rgba(125, 211, 252, 0.9)"
    });
  }

  /* ============================================================
     十二、游戏结束
     ============================================================ */
  function endGame() {
    if (phase === "over") return;

    phase = "over";
    jump = null;
    fall = null;
    isHolding = false;
    chargePanel.classList.remove("active");
    hint.textContent = "按住蓄力 · 松开起跳";
    hint.classList.remove("active");

    const isNewRecord = score > best;
    if (isNewRecord) {
      best = score;
      saveBest(best);
    }
    updateBestUI();

    finalScore.textContent = String(score);

    // 根据失误类型给一句轻松提示
    if (isNewRecord && score > 0) {
      overSub.textContent = "新纪录！这局手感很稳";
    } else if (score === 0) {
      overSub.textContent = "先轻轻按住，感受一下蓄力的节奏";
    } else if (lastMiss === "short") {
      overSub.textContent = "蓄力稍短，再按住久一点";
    } else if (lastMiss === "long") {
      overSub.textContent = "跳过头啦，下次松手早一点";
    } else {
      overSub.textContent = "擦边掉落，再瞄准一点";
    }

    gameOverTitle.textContent = score >= 20 ? "高手也会失手" : "掉下去了";
    gameOverEl.classList.add("show");
    gameOverEl.setAttribute("aria-hidden", "false");
    gameShell.classList.add("is-over");
  }

  /* ============================================================
     十三、每帧逻辑
     ============================================================ */
  function updateSquash(dt) {
    if (squash === 0 && squashVel === 0) return;
    const stiffness = 330;
    const damping = 19;
    const accel = -stiffness * squash - damping * squashVel;
    squashVel += accel * dt;
    squash += squashVel * dt;
    squash = clamp(squash, -0.4, 0.4);

    if (Math.abs(squash) < 0.0006 && Math.abs(squashVel) < 0.004) {
      squash = 0;
      squashVel = 0;
    }
  }

  function updateBubbles(dt) {
    for (const bubble of bubbles) {
      bubble.y -= bubble.speed * dt;
      if (bubble.y < -0.06) {
        bubble.y = 1.06;
        bubble.x = rand(0.03, 0.97);
      }
    }
  }

  function update(now, dt) {
    // 蓄力
    if (phase === "charging") {
      charge = clamp((now - chargeStart) / CHARGE_TIME, 0, 1);
      updateChargeUI(charge);

      if (charge > 0.12 && now - chargeSparkAt > 90) {
        chargeSparkAt = now;
        spawnChargeSpark(now);
      }
    }

    // 跳跃轨迹
    if (phase === "jumping" && jump) {
      const t = clamp((now - jump.start) / (jump.duration * 1000), 0, 1);
      jump.t = t;
      const time = t * jump.duration;

      player.x = lerp(jump.startX, jump.endX, t);
      player.y = jump.startY + jump.vy0 * time - 0.5 * jump.gravity * time * time;
      player.z = jump.startZ;

      if (t >= 1) {
        finishJump(now);
      } else {
        if (now - lastTrailAt > 36) {
          lastTrailAt = now;
          trail.push({
            x: player.x,
            y: player.y,
            z: player.z,
            t,
            at: now
          });
          if (trail.length > 6) trail.shift();
        }
        trail = trail.filter((sample) => now - sample.at < 180);
      }
    }

    // 掉落
    if (phase === "falling" && fall) {
      fall.elapsed += dt;
      fall.vy += FALL_GRAVITY * dt;
      player.y -= fall.vy * dt;
      player.x += fall.vx * dt;
      fall.angle += fall.spin * dt;
      fall.spin += dt * 2.2;

      if (!fall.endQueued && fall.elapsed > 0.5) {
        const foot = project(player.x, player.y, player.z);
        if (foot.y > cssHeight + 90 || fall.elapsed > 1.35) {
          fall.endQueued = true;
          window.clearTimeout(gameOverTimer);
          gameOverTimer = window.setTimeout(endGame, 120);
        }
      }
    }

    // 方块生长动画
    const growBlocks = [nextBlock, currentBlock, prevBlock];
    for (const block of growBlocks) {
      if (block && block.grow < 1) {
        const progress = clamp((now - block.born) / 320, 0, 1);
        block.grow = easeOutCubic(progress);
      }
    }

    updateSquash(dt);
    updateBubbles(dt);
    updateCamera(dt);

    if (effects.length) {
      effects = effects.filter((effect) => now - effect.start < effect.dur);
    }
  }

  /* ============================================================
     十四、绘制辅助
     ============================================================ */
  // 带圆角的多边形路径
  function roundedPolygonPath(points, radius) {
    const n = points.length;
    if (!n) return;

    ctx.beginPath();
    for (let i = 0; i < n; i += 1) {
      const prev = points[(i - 1 + n) % n];
      const curr = points[i];
      const next = points[(i + 1) % n];

      const prevDx = prev.x - curr.x;
      const prevDy = prev.y - curr.y;
      const nextDx = next.x - curr.x;
      const nextDy = next.y - curr.y;
      const prevLen = Math.hypot(prevDx, prevDy) || 1;
      const nextLen = Math.hypot(nextDx, nextDy) || 1;
      const r = Math.min(radius, prevLen * 0.45, nextLen * 0.45);

      const startX = curr.x + (prevDx / prevLen) * r;
      const startY = curr.y + (prevDy / prevLen) * r;
      const endX = curr.x + (nextDx / nextLen) * r;
      const endY = curr.y + (nextDy / nextLen) * r;

      if (i === 0) ctx.moveTo(startX, startY);
      else ctx.lineTo(startX, startY);

      ctx.quadraticCurveTo(curr.x, curr.y, endX, endY);
    }
    ctx.closePath();
  }

  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  function starPath(cx, cy, outer, inner, points, rotation) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i += 1) {
      const radius = i % 2 === 0 ? outer : inner;
      const angle = rotation + (i * Math.PI) / points;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function fillBlockFace(points, topColor, bottomColor) {
    if (!points.length) return;
    const gradient = ctx.createLinearGradient(
      points[0].x, points[0].y,
      points[2].x, points[2].y
    );
    gradient.addColorStop(0, topColor);
    gradient.addColorStop(1, bottomColor);

    roundedPolygonPath(points, 2.5);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.lineJoin = "round";
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = gradient;
    ctx.stroke();
  }

  function getBlockGeometry(block) {
    const hw = block.w / 2;
    const hd = block.d / 2;
    const y = block.h;
    const by = block.h - block.side;

    const near = project(block.x - hw, y, block.z - hd);
    const right = project(block.x + hw, y, block.z - hd);
    const far = project(block.x + hw, y, block.z + hd);
    const left = project(block.x - hw, y, block.z + hd);

    const nearB = project(block.x - hw, by, block.z - hd);
    const rightB = project(block.x + hw, by, block.z - hd);
    const leftB = project(block.x - hw, by, block.z + hd);

    return { near, right, far, left, nearB, rightB, leftB };
  }

  /* ============================================================
     十五、绘制方块
     ============================================================ */
  function drawBlockShadow(block) {
    const bottom = project(block.x, block.h - block.side - 0.02, block.z);
    const radius = Math.max(38, block.w * viewScale * 0.7);
    const grow = block.grow == null ? 1 : block.grow;

    ctx.save();
    ctx.globalAlpha = 0.35 + grow * 0.65;
    ctx.translate(bottom.x + 5, bottom.y + 18);
    ctx.scale(1, 0.3);

    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    gradient.addColorStop(0, "rgba(58, 84, 124, 0.11)");
    gradient.addColorStop(0.68, "rgba(58, 84, 124, 0.05)");
    gradient.addColorStop(1, "rgba(58, 84, 124, 0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBlock(block, now) {
    const raw = getBlockGeometry(block);
    const palette = block.palette;
    const grow = block.grow == null ? 1 : block.grow;
    const center = project(block.x, block.h, block.z);

    // 生成入场动画：从顶面中心轻微放大 / 下移
    let g = raw;
    let markerLift = 0;
    if (grow < 0.999) {
      const s = 0.86 + 0.14 * grow;
      const dy = (1 - grow) * 18;
      const map = (p) => ({
        x: center.x + (p.x - center.x) * s,
        y: center.y + (p.y - center.y) * s + dy
      });
      g = {
        near: map(raw.near),
        right: map(raw.right),
        far: map(raw.far),
        left: map(raw.left),
        nearB: map(raw.nearB),
        rightB: map(raw.rightB),
        leftB: map(raw.leftB)
      };
      markerLift = dy;
    }

    ctx.save();
    ctx.globalAlpha = grow < 0.999 ? 0.25 + 0.75 * grow : 1;

    // 右侧面
    fillBlockFace(
      [g.near, g.right, g.rightB, g.nearB],
      palette.right,
      shade(palette.right, -0.14)
    );

    // 左侧面
    fillBlockFace(
      [g.near, g.left, g.leftB, g.nearB],
      palette.left,
      shade(palette.left, -0.12)
    );

    // 顶面
    const topGradient = ctx.createLinearGradient(
      g.far.x, g.far.y,
      g.near.x, g.near.y
    );
    topGradient.addColorStop(0, shade(palette.top, 0.22));
    topGradient.addColorStop(0.58, palette.top);
    topGradient.addColorStop(1, shade(palette.top, -0.03));

    roundedPolygonPath([g.near, g.right, g.far, g.left], 4);
    ctx.fillStyle = topGradient;
    ctx.fill();
    ctx.lineJoin = "round";
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.84)";
    ctx.stroke();

    // 顶面内圈高光
    const topCenter = { x: center.x, y: center.y + markerLift };
    const inner = [g.near, g.right, g.far, g.left].map((p) => ({
      x: topCenter.x + (p.x - topCenter.x) * 0.83,
      y: topCenter.y + (p.y - topCenter.y) * 0.83
    }));
    roundedPolygonPath(inner, 3);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.36)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // 顶面与侧面交界的柔和亮线
    ctx.beginPath();
    ctx.moveTo(g.left.x, g.left.y);
    ctx.lineTo(g.near.x, g.near.y);
    ctx.lineTo(g.right.x, g.right.y);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // 下一个方块的中心标记：小鲸鱼 + 柔光底座
    if (block === nextBlock && phase !== "over" && grow > 0.55) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.0034);
      const mw = clamp(block.w * viewScale * 0.34, 18, 30);
      const mh = (mw * 39) / 64;
      const bob = Math.sin(now * 0.0034) * 1.5;

      if (whaleReady) {
        ctx.save();
        ctx.globalAlpha = (0.55 + 0.18 * pulse) * grow;
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.ellipse(topCenter.x, topCenter.y, mw * 0.66, mw * 0.34, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(96, 165, 250, 0.38)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.globalAlpha = (0.62 + 0.14 * pulse) * grow;
        ctx.drawImage(
          whaleImg,
          topCenter.x - mw / 2,
          topCenter.y - mh / 2 + bob,
          mw,
          mh
        );
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.ellipse(topCenter.x, topCenter.y, 3.2, 1.65, 0, 0, TAU);
        ctx.fillStyle = "rgba(68, 86, 111, 0.16)";
        ctx.fill();
      }
    }

    ctx.restore();
  }

  /* ============================================================
     十六、绘制角色
     ============================================================ */
  function findSupportBlock(x, z) {
    if (currentBlock &&
        Math.abs(x - currentBlock.x) <= currentBlock.w / 2 &&
        Math.abs(z - currentBlock.z) <= currentBlock.d / 2) {
      return currentBlock;
    }
    if (nextBlock &&
        Math.abs(x - nextBlock.x) <= nextBlock.w / 2 &&
        Math.abs(z - nextBlock.z) <= nextBlock.d / 2) {
      return nextBlock;
    }
    return null;
  }

  function drawPlayerShadow() {
    if (!currentBlock) return;
    if (phase === "falling" || phase === "over") return;

    // 落在方块外时没有投影
    const support = findSupportBlock(player.x, player.z);
    if (!support) return;
    if (player.y < support.h - 0.18) return;

    const base = project(player.x, support.h + 0.005, player.z);
    const airHeight = Math.max(0, player.y - support.h);
    const s = clamp(1 - airHeight * 0.12, 0.32, 1);
    const radius = CHAR_W * viewScale * 0.62 * s;

    ctx.save();
    ctx.translate(base.x, base.y);
    ctx.scale(1, 0.38);

    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    gradient.addColorStop(0, `rgba(43, 63, 94, ${0.22 * s})`);
    gradient.addColorStop(0.7, `rgba(43, 63, 94, ${0.08 * s})`);
    gradient.addColorStop(1, "rgba(43, 63, 94, 0)");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 角色翻滚角度：起跳时轻微后仰，随后一个受控的前空翻，落地前回正
  function rollAngle(t) {
    const u = clamp((t - 0.02) / 0.86, 0, 1);
    const lean = -0.22 * (1 - smoothstep(0, 0.12, t));
    return lean + TAU * easeInOutCubic(u);
  }

  // 世界坐标 > 脚底锚点，绘制角色（可复用于残影）
  function drawCharacterSprite(footX, footY, h, w, sx, sy, angle, alpha) {
    if (!charReady || alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(footX, footY);
    ctx.scale(sx, sy);
    ctx.translate(0, -h * 0.5);
    ctx.rotate(angle);
    ctx.drawImage(charImg, -w * 0.5, -h * 0.5, w, h);
    ctx.restore();
  }

  function drawTrail(now) {
    if (!trail.length) return;
    const h = CHAR_H * viewScale;
    const w = h * CHAR_ASPECT;

    for (const sample of trail) {
      const age = (now - sample.at) / 180;
      if (age < 0 || age > 1) continue;
      const alpha = 0.2 * (1 - age);
      if (alpha <= 0.005) continue;

      const foot = project(sample.x, sample.y, sample.z);
      const tuck = 1 - 0.1 * Math.sin(Math.PI * sample.t);
      drawCharacterSprite(
        foot.x, foot.y,
        h, w,
        tuck * 0.985, tuck * 0.985,
        rollAngle(sample.t),
        alpha
      );
    }
  }

  function drawPlayer(now) {
    if (!charReady) return;

    const h = CHAR_H * viewScale;
    const w = h * CHAR_ASPECT;
    const foot = project(player.x, player.y, player.z);
    if (foot.y < -260 || foot.y > cssHeight + 320) return;

    let sx = 1;
    let sy = 1;
    let angle = 0;
    let lift = 0;
    let jitterX = 0;

    const idle = phase === "ready" ? Math.sin(now * 0.0021) : 0;
    lift = idle * 1.15;

    if (phase === "ready") {
      sx *= 1 + idle * 0.004;
      sy *= 1 - idle * 0.003;
      angle = idle * 0.012;
      // 刚落地时的弹性余韵
      sy -= squash * 0.9;
      sx += squash * 0.75;
    }

    if (phase === "charging") {
      const c = charge;
      const crouch = easeOutCubic(c) * 0.2;
      sy -= crouch;
      sx += crouch * 0.72;
      angle = c * 0.035 + Math.sin(now * 0.03) * 0.006 * c;

      const tremble = Math.max(0, c - 0.62) * 2.6;
      jitterX = Math.sin(now * 0.09) * tremble;

      drawChargeAura(foot, c, now);
    }

    if (phase === "jumping" && jump) {
      const t = jump.t;
      angle = rollAngle(t);

      // 空中收身（翻滚更有“球感”，落地前展开）
      const tuck = 1 - 0.1 * Math.sin(Math.PI * t);
      sx *= tuck;
      sy *= tuck;

      // 起跳拉伸 / 落地的弹性通过弹簧叠加
      sy -= squash * 0.9;
      sx += squash * 0.75;
    }

    if (phase === "falling" && fall) {
      angle = fall.angle;
      const stretch = clamp(fall.vy * 0.006, 0, 0.1);
      sy += stretch;
      sx -= stretch * 0.45;
    }

    // 刚落地时的柔光
    if (landingGlowUntil > now && phase === "ready") {
      drawLandingGlow(foot, now);
    }

    drawCharacterSprite(
      foot.x + jitterX,
      foot.y + lift,
      h, w,
      sx, sy, angle, 1
    );
  }

  function drawChargeAura(foot, c, now) {
    ctx.save();
    ctx.translate(foot.x, foot.y);
    ctx.scale(1, 0.36);

    const glowRadius = 26 + 40 * c;
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRadius);
    glow.addColorStop(0, `rgba(125, 211, 252, ${0.16 + 0.28 * c})`);
    glow.addColorStop(0.55, `rgba(96, 165, 250, ${0.1 + 0.16 * c})`);
    glow.addColorStop(1, "rgba(96, 165, 250, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, glowRadius, 0, TAU);
    ctx.fill();

    // 收缩的蓄力环
    const ringRadius = (0.58 - 0.24 * c) * viewScale;
    ctx.strokeStyle = `rgba(59, 130, 246, ${0.16 + 0.46 * c})`;
    ctx.lineWidth = 1.4 + 2.2 * c;
    ctx.beginPath();
    ctx.arc(0, 0, ringRadius, 0, TAU);
    ctx.stroke();

    // 顶端的微光
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.012);
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.14 + 0.22 * c * pulse})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, ringRadius * 0.72, 0, TAU);
    ctx.stroke();

    ctx.restore();
  }

  function drawLandingGlow(foot, now) {
    const p = clamp(1 - (landingGlowUntil - now) / 420, 0, 1);
    const radius = 18 + p * 46;
    ctx.save();
    ctx.translate(foot.x, foot.y - CHAR_H * viewScale * 0.32);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    glow.addColorStop(0, `rgba(125, 211, 252, ${0.28 * (1 - p)})`);
    glow.addColorStop(1, "rgba(125, 211, 252, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ============================================================
     十七、绘制特效
     ============================================================ */
  function drawEffects(now) {
    for (const effect of effects) {
      const p = (now - effect.start) / effect.dur;
      if (p < 0 || p >= 1) continue;

      if (effect.type === "ring") {
        const radius = 0.28 + easeOutCubic(p) * 0.82;
        const alpha = (1 - p) * (effect.perfect ? 0.5 : 0.32);
        const y = effect.y + 0.002;

        const points = [
          project(effect.x - radius, y, effect.z - radius),
          project(effect.x + radius, y, effect.z - radius),
          project(effect.x + radius, y, effect.z + radius),
          project(effect.x - radius, y, effect.z + radius)
        ];

        roundedPolygonPath(points, 14);
        ctx.strokeStyle = effect.perfect
          ? `rgba(56, 189, 248, ${alpha})`
          : `rgba(125, 155, 196, ${alpha})`;
        ctx.lineWidth = 1.2 + (1 - p) * 1.8;
        ctx.stroke();

        const center = project(effect.x, y, effect.z);
        const glowRadius = 30 * (0.7 + p * 0.7);
        const glow = ctx.createRadialGradient(
          center.x, center.y, 0,
          center.x, center.y, glowRadius
        );
        glow.addColorStop(0, effect.perfect
          ? `rgba(56, 189, 248, ${0.2 * (1 - p)})`
          : `rgba(125, 155, 196, ${0.12 * (1 - p)})`);
        glow.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.scale(1, 0.36);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, glowRadius, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (effect.type === "takeoff-ring") {
        const radius = 0.2 + easeOutCubic(p) * 0.55;
        const alpha = (1 - p) * 0.42;
        const y = effect.y;
        const points = [
          project(effect.x - radius, y, effect.z - radius),
          project(effect.x + radius, y, effect.z - radius),
          project(effect.x + radius, y, effect.z + radius),
          project(effect.x - radius, y, effect.z + radius)
        ];
        roundedPolygonPath(points, 10);
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = 1.4;
        ctx.stroke();
      } else if (effect.type === "flash") {
        const center = project(effect.x, effect.y, effect.z);
        const radius = 12 + easeOutCubic(p) * 58;
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.scale(1, 0.36);
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
        glow.addColorStop(0, `rgba(255, 255, 255, ${0.62 * (1 - p)})`);
        glow.addColorStop(0.45, effect.perfect
          ? `rgba(125, 211, 252, ${0.34 * (1 - p)})`
          : `rgba(191, 219, 254, ${0.24 * (1 - p)})`);
        glow.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (effect.type === "dust") {
        const anchor = project(effect.x, effect.y, effect.z);
        const x = anchor.x + (effect.ox || 0) + effect.vx * p;
        const y = anchor.y + (effect.oy || 0) + effect.vy * p + (effect.grav || 0) * p * p;
        const alpha = (1 - p) * 0.75;
        const size = Math.max(0.4, effect.size * (1 - p * 0.35));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = effect.color;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, TAU);
        ctx.fill();
        ctx.restore();
      } else if (effect.type === "spark") {
        const anchor = project(effect.x, effect.y, effect.z);
        const x = anchor.x + (effect.ox || 0) + effect.vx * p;
        const y = anchor.y + (effect.oy || 0) + effect.vy * p + (effect.grav || 0) * p * p;
        const alpha = (1 - p);
        const size = effect.size * (1 - p * 0.45);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.rotate(effect.rot + effect.spin * p);
        starPath(0, 0, size, size * 0.22, 4, 0);
        ctx.fillStyle = effect.color;
        ctx.fill();
        ctx.restore();
      } else if (effect.type === "whale") {
        if (!whaleReady) continue;
        const anchor = project(effect.x, effect.y, effect.z);
        const x = anchor.x + (effect.ox || 0) + effect.vx * p;
        const y = anchor.y + (effect.oy || 0) + effect.vy * p + (effect.grav || 0) * p * p;
        const alpha = (1 - p) * 0.82;
        const mw = effect.size;
        const mh = (mw * 39) / 64;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.rotate(effect.rot + effect.spin * p);
        ctx.drawImage(whaleImg, -mw / 2, -mh / 2, mw, mh);
        ctx.restore();
      } else if (effect.type === "text") {
        const rise = easeOutCubic(p) * 0.9;
        const pos = project(effect.x, effect.y + rise, effect.z);
        const fadeIn = Math.min(1, p / 0.1);
        const fadeOut = 1 - Math.max(0, (p - 0.58) / 0.42);
        const alpha = clamp(fadeIn * fadeOut, 0, 1);
        const pop = 0.86 + 0.22 * easeOutCubic(Math.min(1, p / 0.16));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(pos.x, pos.y);
        ctx.scale(pop, pop);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";

        if (effect.sub) {
          ctx.font = '700 11px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
          ctx.fillStyle = "#2f6fe4";
          ctx.strokeText(effect.sub, 0, -20);
          ctx.fillText(effect.sub, 0, -20);
        }

        ctx.font = '800 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.lineWidth = 5;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.94)";
        ctx.fillStyle = effect.perfect ? "#2563eb" : "#5b6a83";
        ctx.strokeText(effect.text, 0, 0);
        ctx.fillText(effect.text, 0, 0);

        ctx.restore();
      } else if (effect.type === "bubble") {
        const head = project(player.x, player.y + CHAR_H * 0.92, player.z);
        const bob = Math.sin(now * 0.012) * 2;
        const bx = head.x + 25;
        const by = head.y - 15 + bob;
        const alpha = (1 - p) * 0.95;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
        ctx.strokeStyle = "rgba(59, 130, 246, 0.22)";
        ctx.lineWidth = 1.5;
        roundRectPath(bx - 12, by - 30, 34, 28, 10);
        ctx.fill();
        ctx.stroke();

        // 小尾巴
        ctx.beginPath();
        ctx.moveTo(bx - 10, by - 3);
        ctx.lineTo(bx - 17, by + 5);
        ctx.lineTo(bx - 2, by - 3);
        ctx.closePath();
        ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
        ctx.fill();

        ctx.fillStyle = "#e56767";
        ctx.font = '800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(effect.text, bx + 5, by - 16);
        ctx.restore();
      }
    }
  }

  /* ============================================================
     十八、背景气泡
     ============================================================ */
  function createBubbles() {
    bubbles = [];
    for (let i = 0; i < 18; i += 1) {
      bubbles.push({
        x: rand(0.03, 0.97),
        y: rand(0, 1),
        r: rand(0.8, 4.6),
        speed: rand(0.004, 0.013),
        alpha: rand(0.045, 0.15),
        phase: rand(0, TAU),
        drift: rand(0.4, 1.3)
      });
    }
  }

  function drawBubbles(now) {
    for (const bubble of bubbles) {
      const x = bubble.x * cssWidth + Math.sin(now * 0.0006 + bubble.phase) * 10 * bubble.drift;
      const y = bubble.y * cssHeight;
      const r = bubble.r;

      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = `rgba(118, 174, 235, ${bubble.alpha})`;
      ctx.fill();

      if (r > 2.6) {
        ctx.beginPath();
        ctx.arc(x - r * 0.28, y - r * 0.3, r * 0.26, 0, TAU);
        ctx.fillStyle = `rgba(255, 255, 255, ${bubble.alpha * 1.4})`;
        ctx.fill();
      }
    }
  }

  /* ============================================================
     十九、主渲染
     ============================================================ */
  function drawFallVignette() {
    if (phase !== "falling" || !fall) return;
    const intensity = clamp((fall.elapsed - 0.04) * 0.4, 0, 0.15);
    const gradient = ctx.createRadialGradient(
      cssWidth * 0.5, cssHeight * 0.48, cssHeight * 0.2,
      cssWidth * 0.5, cssHeight * 0.5, cssHeight * 0.78
    );
    gradient.addColorStop(0, "rgba(30, 48, 80, 0)");
    gradient.addColorStop(1, `rgba(30, 48, 80, ${intensity})`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cssWidth, cssHeight);
  }

  function render(now) {
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    drawBubbles(now);

    const blocks = [nextBlock, currentBlock, prevBlock].filter(Boolean);
    // 等距场景中 x 越大的方块越远，先画远处，再画近处
    blocks.sort((a, b) => (b.x + b.z) - (a.x + a.z));

    for (const block of blocks) {
      drawBlockShadow(block);
    }

    for (const block of blocks) {
      drawBlock(block, now);
    }

    drawPlayerShadow();
    drawTrail(now);
    drawPlayer(now);
    drawEffects(now);
    drawFallVignette();
  }

  /* ============================================================
     二十、主循环
     ============================================================ */
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;

    update(now, dt);
    render(now);

    requestAnimationFrame(loop);
  }

  /* ============================================================
     二十一、输入
     ============================================================ */
  canvas.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();

    if (phase === "ready") {
      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (error) {
        // 某些浏览器或场景不支持指针捕获，忽略即可
      }
      beginCharge();
    }
  });

  window.addEventListener("pointerup", (event) => {
    if (!isHolding) return;
    event.preventDefault();
    releaseCharge();
  }, { passive: false });

  window.addEventListener("pointercancel", () => {
    if (isHolding) cancelCharge();
  });

  window.addEventListener("blur", () => {
    if (phase === "charging") cancelCharge();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && phase === "charging") cancelCharge();
    // 回到页面时重置时间基准，避免一次巨大的 dt
    lastTime = performance.now();
  });

  // 空格键也可以蓄力，方便没有鼠标时体验
  window.addEventListener("keydown", (event) => {
    if (event.code !== "Space") return;
    const tag = event.target && event.target.tagName;
    if (tag === "BUTTON" || tag === "A" || tag === "INPUT" || tag === "TEXTAREA") return;
    if (phase !== "ready") return;

    event.preventDefault();
    if (!event.repeat) beginCharge();
  });

  window.addEventListener("keyup", (event) => {
    if (event.code !== "Space") return;
    const tag = event.target && event.target.tagName;
    if (tag === "BUTTON" || tag === "A" || tag === "INPUT" || tag === "TEXTAREA") return;
    if (isHolding) {
      event.preventDefault();
      releaseCharge();
    }
  });

  restartBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    resetGame();
  });

  // 阻止画布上的右键菜单和拖拽选中
  canvas.addEventListener("contextmenu", (event) => event.preventDefault());
  canvas.addEventListener("dragstart", (event) => event.preventDefault());

  /* ============================================================
     二十二、启动
     ============================================================ */
  function resizeAndRender() {
    if (window.__previewFreeze) return;
    resizeCanvas();
    render(performance.now());
  }

  if ("ResizeObserver" in window) {
    const resizeObserver = new ResizeObserver(resizeAndRender);
    resizeObserver.observe(canvas);
  } else {
    window.addEventListener("resize", resizeAndRender);
  }
  window.addEventListener("orientationchange", () => {
    window.setTimeout(resizeAndRender, 120);
  });

  function boot() {
    best = loadBest();
    resizeCanvas();
    createBubbles();
    resetGame();

    // 预览/调试钩子（正式版本中不存在）
    

    if (typeof window.__previewBoot === "function") {
      window.__previewBoot();
      return;
    }

    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  charImg.onload = () => {
    charReady = true;
    boot();
  };
  charImg.onerror = () => {
    charReady = false;
    boot();
  };
  whaleImg.onload = () => {
    whaleReady = true;
  };
  whaleImg.onerror = () => {
    whaleReady = false;
  };

  charImg.src = CHAR_SRC;
  whaleImg.src = WHALE_SRC;
})();
</script>
</body>
</html>
